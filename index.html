<head>

  <title>Plano de estudos</title>
  <style>
    :root {
      color-scheme: light;
      --navy-950: #071225;
      --navy-900: #0b1930;
      --navy-800: #132746;
      --blue-700: #2359d8;
      --blue-600: #2c6cf6;
      --blue-100: #dfeaff;
      --sky-50: #f3f7ff;
      --paper: #ffffff;
      --ink: #182238;
      --muted: #66738a;
      --line: #dce4f0;
      --green: #147a5a;
      --green-soft: #e6f7f0;
      --amber: #a85c00;
      --amber-soft: #fff4df;
      --shadow: 0 18px 50px rgba(21, 43, 79, 0.11);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 75% -15%, rgba(44, 108, 246, 0.12), transparent 34rem),
        var(--sky-50);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    button, select, a { font: inherit; }
    button, select { color: inherit; }
    a { color: inherit; }
    button { cursor: pointer; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      color: #fff;
      background: rgba(7, 18, 37, 0.96);
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(18px);
    }

    .header-inner {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: min(1440px, calc(100% - 40px));
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(145deg, #4c83ff, #2359d8);
      box-shadow: 0 8px 24px rgba(44, 108, 246, 0.32);
    }

    .brand-mark svg { width: 23px; height: 23px; }
    .brand-copy { min-width: 0; }
    .brand-copy strong { display: block; font-size: 1rem; letter-spacing: -0.01em; }
    .brand-copy span { display: block; margin-top: 1px; color: #aebbd0; font-size: 0.78rem; }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-stat {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 11px;
      color: #aebbd0;
      background: rgba(255, 255, 255, 0.045);
      font-size: 0.78rem;
    }

    .header-stat strong { color: #fff; font-size: 0.92rem; }

    .mobile-week-control {
      display: none;
      padding: 14px 20px 0;
    }

    .mobile-week-control label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 750;
    }

    .mobile-week-control select {
      width: 100%;
      min-height: 48px;
      padding: 0 42px 0 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
    }

    .app-shell {
      width: min(1440px, calc(100% - 40px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 34px;
    }

    .sidebar {
      position: sticky;
      top: 74px;
      height: calc(100vh - 74px);
      padding: 34px 0;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .sidebar-title {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .week-list { display: grid; gap: 6px; }

    .week-button {
      width: 100%;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px 0 15px;
      border: 1px solid transparent;
      border-radius: 13px;
      color: #49566e;
      background: transparent;
      text-align: left;
      transition: 150ms ease;
    }

    .week-button:hover { color: var(--blue-700); background: var(--blue-100); }
    .week-button[aria-current="true"] {
      color: #fff;
      background: var(--navy-900);
      box-shadow: 0 9px 22px rgba(11, 25, 48, 0.16);
    }

    .week-button span { font-weight: 750; }
    .week-button small {
      min-width: 29px;
      padding: 3px 7px;
      border-radius: 999px;
      color: var(--muted);
      background: #e9eef6;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .week-button[aria-current="true"] small { color: #dbe7ff; background: rgba(255, 255, 255, 0.12); }

    .content {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      padding: 42px 0 80px;
    }

    .week-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .eyebrow {
      display: block;
      margin-bottom: 8px;
      color: var(--blue-700);
      font-size: 0.78rem;
      font-weight: 850;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy-950);
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .week-summary {
      max-width: 520px;
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .day-jump {
      position: sticky;
      top: 74px;
      z-index: 10;
      display: flex;
      gap: 8px;
      margin: 0 -6px 28px;
      padding: 12px 6px;
      overflow-x: auto;
      background: rgba(243, 247, 255, 0.9);
      backdrop-filter: blur(12px);
      scrollbar-width: none;
    }

    .day-jump::-webkit-scrollbar { display: none; }

    .day-chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #42506a;
      background: var(--paper);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 750;
    }

    .day-chip:hover { color: var(--blue-700); border-color: #a9c1f2; }
    .day-chip span { color: var(--muted); font-size: 0.73rem; }

    .days { width: 100%; min-width: 0; max-width: 100%; display: grid; gap: 24px; }

    .day-card {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      scroll-margin-top: 145px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .day-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 24px;
      color: #fff;
      background:
        radial-gradient(circle at 90% 20%, rgba(91, 137, 255, 0.32), transparent 17rem),
        var(--navy-900);
    }

    .day-card-header h2 { margin: 0; font-size: 1.25rem; letter-spacing: -0.02em; }
    .day-card-header span { flex: 0 0 auto; color: #b9c8df; font-size: 0.82rem; white-space: nowrap; }
    .day-body { padding: 6px 24px 10px; }

    .subject-section { padding: 22px 0; }
    .subject-section + .subject-section { border-top: 1px solid var(--line); }

    .subject-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 0 0 12px;
      color: var(--navy-800);
      font-size: 0.96rem;
      font-weight: 850;
    }

    .subject-title span { color: var(--muted); font-size: 0.75rem; font-weight: 700; }
    .resource-list { display: grid; gap: 8px; }

    .resource-row {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: #f8faff;
      transition: border-color 150ms ease, background 150ms ease;
    }

    .resource-row:hover { border-color: #d4e0f3; background: #f3f7ff; }
    .resource-row.watched { border-color: #bde4d6; background: #f0faf6; }
    .resource-row.watched:hover { border-color: #91d2ba; background: #eaf8f2; }
    .resource-row.watched .resource-title { color: #50655e; }

    .resource-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 11px;
    }

    .resource-icon svg { width: 19px; height: 19px; }
    .resource-icon.video { color: var(--blue-700); background: var(--blue-100); }
    .resource-icon.pdf { color: #b43a36; background: #ffebe9; }
    .resource-icon.notice { color: var(--amber); background: var(--amber-soft); }

    .resource-copy { min-width: 0; }
    .resource-title {
      display: block;
      overflow: hidden;
      color: #24314a;
      font-size: 0.89rem;
      font-weight: 720;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .resource-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .shortcut-badge {
      padding: 2px 7px;
      border-radius: 999px;
      color: var(--green);
      background: var(--green-soft);
      font-weight: 800;
    }

    .resource-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .watch-toggle {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid #cbd7e8;
      border-radius: 11px;
      color: #69768c;
      background: #fff;
      transition: transform 140ms ease, color 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    .watch-toggle:hover { transform: translateY(-1px); color: var(--green); border-color: #8fcbb5; }
    .watch-toggle[aria-pressed="true"] { color: #fff; border-color: var(--green); background: var(--green); }
    .watch-toggle svg { width: 18px; height: 18px; }

    .resource-action {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      background: var(--blue-600);
      text-decoration: none;
      font-size: 0.79rem;
      font-weight: 800;
      transition: transform 140ms ease, background 140ms ease;
    }

    .resource-action:hover { transform: translateY(-1px); background: var(--blue-700); }
    .resource-action.pdf { color: #9f2e2a; background: #ffdfdd; }
    .resource-action.pdf:hover { background: #ffd3d0; }
    .resource-action svg { width: 15px; height: 15px; }
    .notice-text { color: var(--amber); font-size: 0.79rem; font-weight: 750; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .empty-state {
      padding: 60px 24px;
      border: 1px dashed #b8c6dc;
      border-radius: var(--radius);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.55);
      text-align: center;
    }

    .empty-state strong { display: block; margin-bottom: 6px; color: var(--navy-800); }

    dialog {
      width: min(1000px, calc(100% - 32px));
      max-height: calc(100vh - 32px);
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 22px;
      color: #fff;
      background: var(--navy-950);
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.48);
    }

    dialog::backdrop { background: rgba(4, 10, 21, 0.82); backdrop-filter: blur(8px); }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 17px 18px 17px 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .player-copy { min-width: 0; }
    .player-copy small { display: block; margin-bottom: 3px; color: #8fa2bf; font-size: 0.73rem; }
    .player-copy strong { display: block; overflow: hidden; font-size: 0.94rem; text-overflow: ellipsis; white-space: nowrap; }

    .close-player {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.07);
    }

    .close-player:hover { background: rgba(255, 255, 255, 0.13); }
    .close-player svg { width: 20px; height: 20px; }

    .player-frame { aspect-ratio: 16 / 9; display: grid; place-items: center; background: #000; }
    .player-frame video, .player-frame iframe { width: 100%; height: 100%; border: 0; background: #000; }

    .player-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 20px;
      color: #91a4c0;
      font-size: 0.77rem;
    }

    .player-footer a { color: #b8ccff; font-weight: 750; }

    .loading {
      min-height: 50vh;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
    }

    :focus-visible { outline: 3px solid #77a1ff; outline-offset: 3px; }

    @media (max-width: 900px) {
      .header-inner { width: min(100% - 28px, 1440px); }
      .header-stats { display: none; }
      .mobile-week-control { display: block; }
      .app-shell { width: min(100% - 28px, 1440px); grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .content { padding-top: 28px; }
      .day-jump { top: 74px; }
      .week-heading { align-items: flex-start; }
    }

    @media (max-width: 620px) {
      .brand-copy span { display: none; }
      .mobile-week-control { padding-inline: 14px; }
      .app-shell { width: min(100% - 24px, 1440px); }
      .content { padding-bottom: 46px; }
      .week-heading { display: block; }
      .day-card-header { padding: 18px; }
      .day-body { padding: 4px 14px 8px; }
      .subject-section { padding-block: 18px; }
      .resource-row { grid-template-columns: 38px minmax(0, 1fr); padding: 10px 8px; }
      .resource-icon { width: 38px; height: 38px; }
      .resource-title { white-space: normal; }
      .resource-actions, .resource-action, .notice-text { grid-column: 2; justify-self: start; }
      .resource-action { min-height: 36px; }
      dialog { width: 100%; max-width: none; max-height: 100vh; margin: auto 0 0; border-radius: 20px 20px 0 0; }
      .player-footer { align-items: flex-start; flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>

  <script>
    (() => {
      const icons = {
        video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 10.5 19 8v8l-4-2.5z"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg>',
        pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h5M9 14h6M9 18h4"/></svg>',
        notice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 17h.01"/></svg>',
        play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg>',
        download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>',
        check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>'
      };

      const course = window.COURSE_DATA;
      const loadingState = document.getElementById('loadingState');
      const studyView = document.getElementById('studyView');

      if (!course || !Array.isArray(course.items)) {
        loadingState.innerHTML = '<p>Não foi possível carregar os dados do curso. Mantenha o arquivo <strong>course-data.js</strong> na mesma pasta deste HTML.</p>';
        return;
      }

      course.items.forEach((item, index) => { item.id = index; });

      const weekList = document.getElementById('weekList');
      const weekSelect = document.getElementById('weekSelect');
      const weekTitle = document.getElementById('weekTitle');
      const weekSummary = document.getElementById('weekSummary');
      const dayJump = document.getElementById('dayJump');
      const days = document.getElementById('days');
      const playerDialog = document.getElementById('playerDialog');
      const playerFrame = document.getElementById('playerFrame');
      const playerTitle = document.getElementById('playerTitle');
      const playerContext = document.getElementById('playerContext');
      const openOriginal = document.getElementById('openOriginal');
      const weeks = Array.from({ length: course.weeks || 23 }, (_, index) => index + 1);
      const itemsByWeek = new Map(weeks.map(week => [week, course.items.filter(item => item.week === week)]));
      const storedWeek = Number(localStorage.getItem('plano-estudos-semana'));
      const watchedStorageKey = 'plano-estudos-assistidos-v1';
      let watchedItems;
      try {
        watchedItems = new Set(JSON.parse(localStorage.getItem(watchedStorageKey) || '[]'));
      } catch (_) {
        watchedItems = new Set();
      }
      let selectedWeek = weeks.includes(storedWeek) ? storedWeek : 1;

      document.getElementById('totalWeeks').textContent = course.weeks || weeks.length;
      document.getElementById('totalVideos').textContent = course.summary.videos;
      document.getElementById('totalPdfs').textContent = course.summary.pdfs;

      const escapeHtml = value => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

      const cleanSpaces = value => value.replace(/\s+/g, ' ').trim();
      const cleanDay = value => cleanSpaces(value.replace(/^\s*\d+\s*[-–]?\s*/, ''))
        .replace(/Segunda\s+Feira/i, 'Segunda-feira')
        .replace(/Terça\s+Feira/i, 'Terça-feira')
        .replace(/Quarta\s+Feira/i, 'Quarta-feira')
        .replace(/Quinta\s+Feira/i, 'Quinta-feira')
        .replace(/Sexta\s+Feira/i, 'Sexta-feira');

      const cleanSubject = value => cleanSpaces(value)
        .replace(/especícifos/gi, 'Específicos');

      const formatSize = bytes => {
        if (!bytes) return '';
        if (bytes >= 1024 ** 3) return `${(bytes / 1024 ** 3).toFixed(1)} GB`;
        if (bytes >= 1024 ** 2) return `${Math.max(1, Math.round(bytes / 1024 ** 2))} MB`;
        return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      };

      const plural = (count, singular, pluralWord) => `${count} ${count === 1 ? singular : pluralWord}`;
      const makeId = (week, index) => `semana-${week}-dia-${index + 1}`;
      const watchedKey = item => `${item.week}|${item.day}|${item.path}`;

      function renderWeekNavigation() {
        weekList.innerHTML = weeks.map(week => {
          const count = (itemsByWeek.get(week) || []).length;
          return `<button class="week-button" type="button" data-week="${week}" aria-current="${week === selectedWeek}">
            <span>Semana ${week}</span><small>${count}</small>
          </button>`;
        }).join('');

        weekSelect.innerHTML = weeks.map(week => {
          const count = (itemsByWeek.get(week) || []).length;
          return `<option value="${week}">Semana ${week} · ${count} itens</option>`;
        }).join('');
        weekSelect.value = String(selectedWeek);
      }

      function groupWeek(items) {
        const grouped = new Map();
        items.forEach(item => {
          if (!grouped.has(item.day)) grouped.set(item.day, []);
          grouped.get(item.day).push(item);
        });
        return [...grouped.entries()].sort((a, b) => a[1][0].dayOrder - b[1][0].dayOrder);
      }

      function resourceMarkup(item) {
        const typeLabel = item.type === 'video' ? (item.external ? 'Vídeo externo' : 'Videoaula') : item.type === 'pdf' ? 'Material em PDF' : 'Aviso';
        const shortcut = item.shortcut ? '<span class="shortcut-badge">Arquivo reaproveitado</span>' : '';
        const size = item.type !== 'notice' && item.size ? `<span>${formatSize(item.size)}</span>` : '';
        const watched = item.type === 'video' && watchedItems.has(watchedKey(item));
        let action = `<span class="notice-text">${escapeHtml(item.note || 'Sem vídeo para este conteúdo')}</span>`;

        if (item.type === 'video') {
          const watchedLabel = watched ? 'Marcar como não assistido' : 'Marcar como assistido';
          action = `<div class="resource-actions">
            <button class="watch-toggle" type="button" data-mark="${item.id}" aria-pressed="${watched}" aria-label="${watchedLabel}" title="${watchedLabel}">${icons.check}<span class="sr-only">${watchedLabel}</span></button>
            <button class="resource-action" type="button" data-play="${item.id}">${icons.play} Assistir</button>
          </div>`;
        } else if (item.type === 'pdf') {
          action = `<a class="resource-action pdf" href="${escapeHtml(item.downloadUrl)}" target="_blank" rel="noopener noreferrer">${icons.download} Baixar PDF</a>`;
        }

        return `<article class="resource-row${watched ? ' watched' : ''}">
          <div class="resource-icon ${item.type}">${icons[item.type]}</div>
          <div class="resource-copy">
            <span class="resource-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</span>
            <div class="resource-meta"><span>${typeLabel}</span>${size}${shortcut}</div>
          </div>
          ${action}
        </article>`;
      }

      function renderDay(dayName, items, dayIndex) {
        const bySubject = new Map();
        items.forEach(item => {
          const subject = cleanSubject(item.subject);
          if (!bySubject.has(subject)) bySubject.set(subject, []);
          bySubject.get(subject).push(item);
        });

        const subjectMarkup = [...bySubject.entries()].map(([subject, subjectItems]) => `
          <section class="subject-section">
            <h3 class="subject-title">${escapeHtml(subject)} <span>${plural(subjectItems.length, 'item', 'itens')}</span></h3>
            <div class="resource-list">${subjectItems.map(resourceMarkup).join('')}</div>
          </section>`).join('');

        return `<section class="day-card" id="${makeId(selectedWeek, dayIndex)}">
          <header class="day-card-header">
            <h2>${escapeHtml(cleanDay(dayName))}</h2>
            <span>${plural(items.length, 'material', 'materiais')}</span>
          </header>
          <div class="day-body">${subjectMarkup}</div>
        </section>`;
      }

      function renderSelectedWeek(scrollToTop = false) {
        const items = itemsByWeek.get(selectedWeek) || [];
        const groupedDays = groupWeek(items);
        const videoCount = items.filter(item => item.type === 'video').length;
        const pdfCount = items.filter(item => item.type === 'pdf').length;
        const watchedCount = items.filter(item => item.type === 'video' && watchedItems.has(watchedKey(item))).length;
        const watchedSummary = videoCount ? ` · ${watchedCount}/${videoCount} assistidos` : '';

        weekTitle.textContent = `Semana ${selectedWeek}`;
        weekSummary.textContent = `${plural(groupedDays.length, 'dia de estudo', 'dias de estudo')} · ${plural(videoCount, 'vídeo', 'vídeos')} · ${plural(pdfCount, 'PDF', 'PDFs')}${watchedSummary}`;
        document.title = `Semana ${selectedWeek} — Plano de estudos`;

        dayJump.innerHTML = groupedDays.map(([dayName, dayItems], index) => `
          <a class="day-chip" href="#${makeId(selectedWeek, index)}">${escapeHtml(cleanDay(dayName))}<span>${dayItems.length}</span></a>`).join('');

        days.innerHTML = groupedDays.length
          ? groupedDays.map(([dayName, dayItems], index) => renderDay(dayName, dayItems, index)).join('')
          : '<div class="empty-state"><strong>Nenhum material nesta semana</strong><span>Escolha outra semana para continuar.</span></div>';

        document.querySelectorAll('.week-button').forEach(button => {
          button.setAttribute('aria-current', String(Number(button.dataset.week) === selectedWeek));
        });
        weekSelect.value = String(selectedWeek);
        localStorage.setItem('plano-estudos-semana', String(selectedWeek));

        if (scrollToTop) window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function selectWeek(week) {
        if (!weeks.includes(week)) return;
        selectedWeek = week;
        renderSelectedWeek(true);
      }

      function youtubeEmbedUrl(rawUrl) {
        try {
          const url = new URL(rawUrl);
          let videoId = '';
          if (url.hostname.includes('youtu.be')) videoId = url.pathname.slice(1);
          if (url.hostname.includes('youtube.com')) videoId = url.searchParams.get('v') || '';
          if (!videoId) return null;

          const timeValue = url.searchParams.get('t') || url.searchParams.get('start') || '';
          const start = Number.parseInt(timeValue, 10) || 0;
          return `https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}${start ? `?start=${start}` : ''}`;
        } catch (_) {
          return null;
        }
      }

      function openPlayer(item) {
        const youtubeUrl = item.external ? youtubeEmbedUrl(item.mediaUrl) : null;
        playerTitle.textContent = item.title;
        playerContext.textContent = `Semana ${item.week} · ${cleanDay(item.day)} · ${cleanSubject(item.subject)}`;
        openOriginal.href = item.mediaUrl;

        if (youtubeUrl) {
          playerFrame.innerHTML = `<iframe src="${escapeHtml(youtubeUrl)}" title="${escapeHtml(item.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
        } else {
          playerFrame.innerHTML = `<video controls playsinline preload="metadata"><source src="${escapeHtml(item.mediaUrl)}" type="video/mp4">Seu navegador não conseguiu reproduzir este vídeo.</video>`;
        }

        playerDialog.showModal();
        document.body.style.overflow = 'hidden';
      }

      function closePlayer() {
        if (playerDialog.open) playerDialog.close();
      }

      weekList.addEventListener('click', event => {
        const button = event.target.closest('[data-week]');
        if (button) selectWeek(Number(button.dataset.week));
      });

      weekSelect.addEventListener('change', () => selectWeek(Number(weekSelect.value)));

      days.addEventListener('click', event => {
        const marker = event.target.closest('[data-mark]');
        if (marker) {
          const item = course.items[Number(marker.dataset.mark)];
          if (!item) return;
          const key = watchedKey(item);
          const isNowWatched = !watchedItems.has(key);
          if (isNowWatched) watchedItems.add(key);
          else watchedItems.delete(key);
          localStorage.setItem(watchedStorageKey, JSON.stringify([...watchedItems]));

          const label = isNowWatched ? 'Marcar como não assistido' : 'Marcar como assistido';
          marker.setAttribute('aria-pressed', String(isNowWatched));
          marker.setAttribute('aria-label', label);
          marker.setAttribute('title', label);
          marker.querySelector('.sr-only').textContent = label;
          marker.closest('.resource-row').classList.toggle('watched', isNowWatched);
          renderSelectedWeek();
          return;
        }

        const playButton = event.target.closest('[data-play]');
        if (!playButton) return;
        const item = course.items[Number(playButton.dataset.play)];
        if (item) openPlayer(item);
      });

      document.getElementById('closePlayer').addEventListener('click', closePlayer);
      playerDialog.addEventListener('click', event => {
        const rect = playerDialog.getBoundingClientRect();
        const outside = event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom;
        if (outside) closePlayer();
      });
      playerDialog.addEventListener('close', () => {
        playerFrame.innerHTML = '';
        document.body.style.overflow = '';
      });

      renderWeekNavigation();
      renderSelectedWeek();
      loadingState.hidden = true;
      studyView.hidden = false;
    })();
  </script>
</body>
</html>
